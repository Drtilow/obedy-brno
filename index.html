<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Menu v Brně">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <title>Menu v Brně · Polední nabídka restaurací</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ta-green: #00aa6c;
      --ta-green-hover: #00875a;
      --ta-green-dark: #004f32;
      --ta-green-light: #e8f9f2;
      --ta-green-border: #b8ebd6;

      --bg-page: #f2f4f8;
      --bg-card: #ffffff;
      --border-color: #e5e7eb;
      --border-card: #e0e0e0;

      --text-dark: #000000;
      --text-main: #111827;
      --text-muted: #545454;
      --text-light: #767676;

      --pill-bg: #f2f2f2;
      --pill-hover: #e5e5e5;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;

      --shadow-card: 0 2px 10px rgba(0, 0, 0, 0.06);
      --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    * , *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      padding: 0 0 max(60px, calc(32px + env(safe-area-inset-bottom)));
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }

    /* --- Horní Navigační lišta --- */
    .top-nav {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    /* Logo ikona */
    .logo-icon {
      width: 38px;
      height: 38px;
      background: var(--ta-green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      flex-shrink: 0;
    }

    .logo-text-box h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.1;
    }

    .logo-badge {
      background: var(--ta-green-light);
      color: var(--ta-green-dark);
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .logo-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .nav-right-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--pill-bg);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
    }

    .dot-live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ta-green);
      display: inline-block;
    }

    /* --- Hero Search & Banner --- */
    .hero-banner {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 28px 20px 24px;
      margin-bottom: 28px;
    }

    .hero-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .hero-title-row {
      margin-bottom: 16px;
    }

    .hero-title-row h2 {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.02em;
    }

    .hero-title-row p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    /* Velký vyhledávací panel */
    .search-bar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      position: relative;
      flex: 1 1 340px;
      max-width: 600px;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      pointer-events: none;
      display: flex;
    }

    .search-input {
      width: 100%;
      padding: 13px 44px 13px 46px;
      font-size: 16px;
      font-family: inherit;
      border: 2px solid #d0d7de;
      border-radius: var(--radius-full);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      background: #ffffff;
      -webkit-appearance: none;
    }

    .search-input:focus {
      border-color: var(--ta-green);
      box-shadow: 0 0 0 4px rgba(0, 170, 108, 0.15);
    }

    .clear-search-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 4px;
      display: none;
    }

    /* Rychlé filtry (Filter pills) */
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    @media (max-width: 640px) {
      .filter-pills {
        flex-wrap: nowrap;
        overflow-x: auto;
        width: 100%;
        padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .filter-pills::-webkit-scrollbar {
        display: none;
      }
      .filter-pill {
        flex-shrink: 0;
      }
    }

    .filter-pill {
      background: var(--pill-bg);
      color: var(--text-dark);
      border: 1px solid transparent;
      border-radius: var(--radius-full);
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .filter-pill:hover {
      background: var(--pill-hover);
    }

    .filter-pill.active {
      background: var(--ta-green-light);
      color: var(--ta-green-dark);
      border-color: var(--ta-green-border);
    }

    /* --- Status lišta s počtem nalezených --- */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .results-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* --- Víkendová karta & Info bannery --- */
    .stale-banner {
      grid-column: 1 / -1;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font-size: 0.92rem;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .stale-warning {
      background: #fff8e6;
      border: 1px solid #ffd580;
      color: #8a5300;
    }

    .weekend-archive-notice {
      background: #eef4ff;
      border: 1px solid #c7d9fe;
      color: #1e40af;
    }

    .btn-text-link {
      background: transparent;
      border: none;
      cursor: pointer;
      color: inherit;
      font-weight: 600;
      text-decoration: underline;
      font-size: 0.9rem;
      white-space: nowrap;
      padding: 4px 8px;
    }

    .btn-text-link:hover {
      opacity: 0.8;
    }

    .weekend-hero-card {
      grid-column: 1 / -1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 56px 24px;
      text-align: center;
      box-shadow: var(--shadow-card);
      max-width: 640px;
      margin: 10px auto 30px;
    }

    .weekend-icon {
      font-size: 3.2rem;
      margin-bottom: 16px;
      line-height: 1;
    }

    .weekend-hero-card h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .weekend-desc {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    .weekend-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: var(--radius-full);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      font-family: inherit;
    }

    .weekend-toggle-btn:hover {
      background: #f8fafc;
      border-color: var(--ta-green);
      color: var(--ta-green-dark);
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }

    /* --- Grid karet --- */
    .restaurant-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 480px) {
      .restaurant-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* --- Karta restaurace --- */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .card:hover {
        transform: translateY(-8px) scale(1.1);
        box-shadow: 0 20px 45px -8px rgba(0, 0, 0, 0.18), 0 10px 20px -10px rgba(0, 0, 0, 0.1);
        border-color: var(--ta-green);
        z-index: 50;
      }
    }

    /* Hlavička karty */
    .card-header {
      padding: 20px 20px 14px;
      border-bottom: 1px solid #f0f0f0;
      background: #ffffff;
    }

    .card-top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .restaurant-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .choice-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--ta-green-light);
      color: var(--ta-green-dark);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Bubliny hodnocení (Rating Bubbles) */
    .rating-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .ta-bubbles {
      display: flex;
      gap: 3px;
    }

    .ta-bubble {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--ta-green);
      display: inline-block;
    }

    .rating-score {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .rating-count {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Tagy podniku */
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .card-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--pill-bg);
      color: #333333;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: var(--radius-sm);
      text-decoration: none;
    }

    .card-tag.address-link:hover {
      background: var(--ta-green-light);
      color: var(--ta-green-dark);
    }

    /* --- Pruh Polévky (Mint Banner) --- */
    .soup-banner {
      background: var(--ta-green-light);
      border-bottom: 1px solid var(--ta-green-border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.88rem;
    }

    .soup-badge {
      background: var(--ta-green);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }

    .soup-name {
      font-weight: 600;
      color: var(--ta-green-dark);
      flex: 1;
      line-height: 1.35;
    }

    .soup-price {
      font-weight: 700;
      color: var(--ta-green-dark);
      font-size: 0.85rem;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* --- Seznam jídel --- */
    .food-list {
      display: flex;
      flex-direction: column;
    }

    .food-item {
      padding: 13px 20px;
      border-bottom: 1px solid #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      transition: background-color 0.12s ease;
    }

    .food-item:last-child {
      border-bottom: none;
    }

    .food-item:hover {
      background-color: #fafafa;
    }

    .food-info {
      flex: 1 1 auto;
      min-width: 0;
    }

    .food-title {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-dark);
      line-height: 1.38;
      word-break: break-word;
    }

    .food-number {
      font-weight: 700;
      color: var(--text-light);
      margin-right: 4px;
    }

    .tag-gluten {
      display: inline-flex;
      align-items: center;
      background: var(--ta-green-light);
      color: var(--ta-green-dark);
      border: 1px solid var(--ta-green-border);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-radius: 4px;
      padding: 1px 6px;
      margin-right: 6px;
      vertical-align: 1px;
    }

    .food-price {
      flex-shrink: 0;
      background: var(--pill-bg);
      color: var(--text-dark);
      font-weight: 700;
      font-size: 0.88rem;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* --- Nedostupná restaurace / Prázdný stav --- */
    .unavailable-body {
      padding: 34px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .unavailable-icon {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .unavailable-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Obrázkové menu */
    .image-body {
      padding: 16px;
      text-align: center;
      background: #fafafa;
    }

    .image-body img {
      max-width: 100%;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      cursor: zoom-in;
    }

    /* Zvýraznění při vyhledávání */
    mark.highlight {
      background-color: #fef08a;
      color: #854d0e;
      padding: 1px 3px;
      border-radius: 3px;
    }

    /* Žádné výsledky */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: #ffffff;
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-lg);
      color: var(--text-muted);
    }

    .no-results h3 {
      font-size: 1.15rem;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    /* Footer */
    .app-footer {
      margin-top: 50px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-light);
    }
  </style>
</head>
<body>

  <!-- Horní Navbar -->
  <header class="top-nav">
    <div class="nav-inner">
      <a href="#" class="logo-group">
        <div class="logo-icon">
          <!-- Gastronomická ikona příboru -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path>
            <path d="M7 2v20"></path>
            <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path>
          </svg>
        </div>
        <div class="logo-text-box">
          <h1>Menu v Brně <span class="logo-badge">Dnes</span></h1>
          <div class="logo-subtitle">Denní obědová nabídka restaurací</div>
        </div>
      </a>

      <div class="nav-right-meta">
        <div class="date-badge">
          <span class="dot-live"></span>
          <span id="datum-text">Dnes</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Hero sekce s vyhledáváním a filtry -->
  <section class="hero-banner">
    <div class="hero-container">
      <div class="hero-title-row">
        <h2 id="hero-den-nadpis">Menu v Brně</h2>
        <p>Prohlížejte denní nabídku brněnských restaurací oblíbených mezi URSáky</p>
      </div>

      <div class="search-bar-row">
        <div class="search-box">
          <span class="search-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input 
            type="search" 
            id="search-input" 
            class="search-input" 
            placeholder="Hledat jídlo nebo restauraci… (např. řízek, burger, salát)"
            autocomplete="off"
          >
          <button id="clear-search" class="clear-search-btn" title="Vymazat">&times;</button>
        </div>

        <!-- Rychlé filtry -->
        <div class="filter-pills">
          <button class="filter-pill active" data-filter="all">Vše</button>
          <button class="filter-pill" data-filter="soup">S polévkou v ceně</button>
          <button class="filter-pill" data-filter="gluten">Bez lepku</button>
          <button class="filter-pill" data-filter="price">Do 185 Kč</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Hlavní obsah -->
  <div class="main-container">
    <div class="results-bar">
      <span id="results-count">Načítám restaurace…</span>
      <span id="open-count"></span>
    </div>

    <div class="state-message" id="stav" style="text-align: center; padding: 40px; color: #666;">
      Načítám čerstvé menu…
    </div>

    <!-- Mřížka karet restaurací -->
    <main class="restaurant-grid" id="karty"></main>

    <footer class="app-footer">
      Menu v Brně · Přehled poledních nabídek · Automatická aktualizace každé ráno
    </footer>
  </div>

<script>
  const DNY = ['Neděle', 'Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek', 'Sobota'];
  let VSECHNA_DATA = [];
  let AKTIVNI_FILTER = 'all';

  // Reprezentativní hodnocení a tagy restaurací
  const HODNOCENI_MAPA = {
    'Korzar': { skore: '4.8', recenzi: '240', badge: '⭐ Volba hostů', kuchyne: '$$ · Česká / Grill' },
    'Pizzerie VIVA': { skore: '4.7', recenzi: '190', badge: '🍕 Oblíbené', kuchyne: '$$ · Italská / Pizza' },
    'SONO Grill & Bar': { skore: '4.9', recenzi: '310', badge: '🏆 Nejlépe hodnocené', kuchyne: '$$$ · Moderní Grill' },
    'Fresh Menu (Šumavská/Veveří)': { skore: '4.6', recenzi: '150', badge: '🥗 Zdravý výběr', kuchyne: '$ · Denní bistro' },
    'Plzeňský dvůr': { skore: '4.7', recenzi: '280', badge: '🍺 Tradiční hospoda', kuchyne: '$$ · Česká klasika' },
    'U Nemilosrdných Bratří': { skore: '4.5', recenzi: '110', badge: 'Klidné bistro', kuchyne: '$ · Domácí kuchyně' },
    'U Primů': { skore: '4.6', recenzi: '175', badge: 'Poctivá klasika', kuchyne: '$ · Česká kuchyně' },
    'U Dřeváka Beer&Grill': { skore: '4.8', recenzi: '265', badge: '🔥 Skvělý grill', kuchyne: '$$ · Burgery & Grill' },
  };

  function ziskejMetadata(nazev) {
    return HODNOCENI_MAPA[nazev] || {
      skore: '4.7',
      recenzi: '150',
      badge: '⭐ Doporučeno',
      kuchyne: '$$ · Polední menu'
    };
  }

  function dnesniDatum() {
    const d = new Date();
    return `${d.getDate()}. ${d.getMonth() + 1}. ${d.getFullYear()}`;
  }

  function formatujCenu(cena) {
    if (!cena) return '';
    if (!/\d/.test(cena)) return cena;
    const cislice = cena.replace(/\D/g, '');
    return `${cislice} Kč`;
  }

  function ziskejCiselnouCenu(cena) {
    if (!cena || !/\d/.test(cena)) return 999;
    return parseInt(cena.replace(/\D/g, ''), 10);
  }

  function normalizujText(text) {
    if (!text) return '';
    const bezCislic = text.replace(/[\d\s,.-]/g, '');
    if (bezCislic.length > 0 && bezCislic === bezCislic.toUpperCase()) {
      return text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
    }
    return text;
  }

  function rozpoznejPoznamku(nazev) {
    const m = nazev.match(/^\s*(bezlepkov[ée])[-\s]*/i);
    if (!m) return { poznamka: null, nazev };
    return { poznamka: 'BEZ LEPKU', nazev: nazev.slice(m[0].length) };
  }

  function highlightQuery(text, query) {
    if (!query) return text;
    const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`(${escaped})`, 'gi');
    return text.replace(regex, '<mark class="highlight">$1</mark>');
  }

  function vytvorPolozkuHtml(polozka, searchQuery = '') {
    const { poznamka, nazev: nazevRaw } = rozpoznejPoznamku(polozka.nazev);
    const nazev = normalizujText(nazevRaw);
    const nazevDisplay = highlightQuery(nazev, searchQuery);

    return `
      <div class="food-item">
        <div class="food-info">
          <div class="food-title">
            <span class="food-number">${polozka.cislo}.</span>
            ${poznamka ? `<span class="tag-gluten">${poznamka}</span>` : ''}
            ${nazevDisplay}
          </div>
        </div>
        <span class="food-price">${formatujCenu(polozka.cena)}</span>
      </div>`;
  }

  function vytvorObsahKarty(restaurace, searchQuery = '') {
    if (restaurace.typ === 'obrazek') {
      return `
        <div class="image-body">
          <img src="${restaurace.obrazek_url}" alt="Menu – ${restaurace.restaurace}" loading="lazy" onclick="window.open(this.src, '_blank')">
        </div>`;
    }

    if (restaurace.dostupne === false) {
      return `
        <div class="unavailable-body">
          <div class="unavailable-icon">☕</div>
          <div class="unavailable-text">${restaurace.duvod || 'Dnes menu není k dispozici'}</div>
        </div>`;
    }

    const polozky = restaurace.polozky || [];
    const maPolevku = polozky.length > 0 && (polozky[0].cena === 'v ceně' || /polévk|krém|vývar/i.test(polozky[0].nazev));
    const polevka = maPolevku ? polozky[0] : null;
    const hlavniRaw = maPolevku ? polozky.slice(1) : polozky;
    const hlavni = hlavniRaw.map((p, i) => ({ ...p, cislo: i + 1 }));

    // Filtrování
    const q = searchQuery.toLowerCase().trim();
    let zobrazenyHlavni = hlavni;
    let polevkaOdpovida = true;

    // Aplikace aktivního filtru pill
    if (AKTIVNI_FILTER === 'soup') {
      if (!polevka) return null; // Skryje celou restauraci, pokud nemá polévku
    } else if (AKTIVNI_FILTER === 'gluten') {
      zobrazenyHlavni = zobrazenyHlavni.filter(p => /bezlepkov/i.test(p.nazev) || /\bBL\b/i.test(p.nazev));
      polevkaOdpovida = polevka && (/bezlepkov/i.test(polevka.nazev) || /\bBL\b/i.test(polevka.nazev));
      if (!polevkaOdpovida && zobrazenyHlavni.length === 0) return null;
    } else if (AKTIVNI_FILTER === 'price') {
      zobrazenyHlavni = zobrazenyHlavni.filter(p => ziskejCiselnouCenu(p.cena) <= 185);
      if (zobrazenyHlavni.length === 0) return null;
    }

    // Aplikace textového vyhledávání
    if (q) {
      const jmenoRestauraceOdpovida = restaurace.restaurace.toLowerCase().includes(q);
      if (!jmenoRestauraceOdpovida) {
        zobrazenyHlavni = zobrazenyHlavni.filter(p => p.nazev.toLowerCase().includes(q));
        polevkaOdpovida = polevka && polevka.nazev.toLowerCase().includes(q);
      }
    }

    const soupHtml = (polevka && polevkaOdpovida) ? `
      <div class="soup-banner">
        <span class="soup-badge">Polévka</span>
        <span class="soup-name">${highlightQuery(polevka.nazev, q)}</span>
        <span class="soup-price">${polevka.cena === 'v ceně' ? 'v ceně' : formatujCenu(polevka.cena)}</span>
      </div>` : '';

    const seznamHtml = zobrazenyHlavni.length
      ? `<div class="food-list">${zobrazenyHlavni.map(p => vytvorPolozkuHtml(p, q)).join('')}</div>`
      : '';

    if (!soupHtml && !seznamHtml && (q || AKTIVNI_FILTER !== 'all')) {
      return null;
    }

    return soupHtml + seznamHtml;
  }

  function vytvorKartu(restaurace, searchQuery = '') {
    const obsah = vytvorObsahKarty(restaurace, searchQuery);
    if (obsah === null) return ''; // Restaurace nevyhovuje filtru

    const metaInfo = ziskejMetadata(restaurace.restaurace);
    const q = searchQuery.toLowerCase().trim();
    const jmenoDisplay = highlightQuery(restaurace.restaurace, q);

    const tagsHtml = [];
    if (restaurace.oteviraci_doba) {
      tagsHtml.push(`<span class="card-tag">🕐 ${restaurace.oteviraci_doba}</span>`);
    }
    if (restaurace.adresa) {
      const gmaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(restaurace.restaurace + ' ' + restaurace.adresa + ' Brno')}`;
      tagsHtml.push(`<a href="${gmaps}" target="_blank" rel="noopener noreferrer" class="card-tag address-link" title="Zobrazit na mapě">📍 ${restaurace.adresa}</a>`);
    }
    tagsHtml.push(`<span class="card-tag">${metaInfo.kuchyne}</span>`);

    return `
      <article class="card">
        <div class="card-header">
          <div class="card-top-row">
            <h3 class="restaurant-title">${jmenoDisplay}</h3>
            <span class="choice-badge">${metaInfo.badge}</span>
          </div>

          <div class="rating-row">
            <div class="ta-bubbles">
              <span class="ta-bubble"></span>
              <span class="ta-bubble"></span>
              <span class="ta-bubble"></span>
              <span class="ta-bubble"></span>
              <span class="ta-bubble"></span>
            </div>
            <span class="rating-score">${metaInfo.skore}</span>
            <span class="rating-count">(${metaInfo.recenzi} hodnocení)</span>
          </div>

          <div class="card-tags">
            ${tagsHtml.join('')}
          </div>
        </div>

        ${obsah}
      </article>`;
  }

  let JE_VIKEND = false;
  let ZOBRAZIT_ARCHIV = false;
  let DATA_DATUM = null;
  let JSOU_DATA_STARA = false;

  function formatujDatumCz(isoDatum) {
    if (!isoDatum) return '';
    const casti = isoDatum.split('-');
    if (casti.length !== 3) return isoDatum;
    return `${parseInt(casti[2], 10)}. ${parseInt(casti[1], 10)}. ${casti[0]}`;
  }

  function pripojListenerSkrytArchiv() {
    const btnSkryt = document.getElementById('btn-skryt-archiv');
    if (btnSkryt) {
      btnSkryt.addEventListener('click', () => {
        ZOBRAZIT_ARCHIV = false;
        renderData(searchInput.value);
      });
    }
  }

  function renderData(query = '') {
    const karty = document.getElementById('karty');
    const resultsCount = document.getElementById('results-count');
    const q = query.toLowerCase().trim();

    // Pokud je víkend a uživatel si nevyžádal páteční archiv ani nevyhledává
    if (JE_VIKEND && !ZOBRAZIT_ARCHIV && !q) {
      resultsCount.textContent = 'Víkendový režim · Restaurace vaří ze stálého lístku';
      karty.innerHTML = `
        <div class="weekend-hero-card">
          <div class="weekend-icon">☕🌿</div>
          <h2>Přejeme pohodový víkend!</h2>
          <p class="weekend-desc">
            Brněnské restaurace o víkendu denní polední menu nenabízejí a vaří ze stálých lístků.<br>
            Čerstvá polední nabídka na nový týden se načte automaticky v pondělí dopoledne.
          </p>
          <button type="button" class="weekend-toggle-btn" id="btn-zobrazit-archiv">
            <span>👁️</span> Zobrazit páteční nabídku pro inspiraci
          </button>
        </div>
      `;

      const btnArchiv = document.getElementById('btn-zobrazit-archiv');
      if (btnArchiv) {
        btnArchiv.addEventListener('click', () => {
          ZOBRAZIT_ARCHIV = true;
          renderData(searchInput.value);
        });
      }
      return;
    }

    const vygenerovaneKarty = VSECHNA_DATA.map(r => vytvorKartu(r, q)).filter(html => html !== '');

    let infoBannerHtml = '';
    if (JE_VIKEND) {
      infoBannerHtml = `
        <div class="stale-banner weekend-archive-notice">
          <div>
            ℹ️ <strong>Inspirace z pátku:</strong> Zobrazujete polední nabídku z pátku. O víkendu restaurace polední meníčka nevaří.
          </div>
          <button type="button" class="btn-text-link" id="btn-skryt-archiv">Skrýt archiv</button>
        </div>
      `;
    } else if (JSOU_DATA_STARA) {
      infoBannerHtml = `
        <div class="stale-banner stale-warning">
          ⚠️ <strong>Upozornění:</strong> Zobrazena nabídka z ${formatujDatumCz(DATA_DATUM)}. Dnešní meníčka se zatím stahují nebo je podniky ještě nezveřejnily.
        </div>
      `;
    }

    if (vygenerovaneKarty.length === 0) {
      karty.innerHTML = infoBannerHtml + `
        <div class="no-results">
          <h3>Nebyly nalezeny žádné nabídky</h3>
          <p>Pro zadaná kritéria a výraz „<strong>${query || AKTIVNI_FILTER}</strong>“ neodpovídá žádné jídlo.</p>
        </div>`;
      resultsCount.textContent = '0 nalezených restaurací';
      pripojListenerSkrytArchiv();
      return;
    }

    karty.innerHTML = infoBannerHtml + vygenerovaneKarty.join('');
    pripojListenerSkrytArchiv();

    if (JE_VIKEND) {
      resultsCount.textContent = `Páteční archiv · ${vygenerovaneKarty.length} restaurací`;
    } else if (q || AKTIVNI_FILTER !== 'all') {
      resultsCount.textContent = `Zobrazeno ${vygenerovaneKarty.length} z ${VSECHNA_DATA.length} restaurací`;
    } else {
      resultsCount.textContent = `Zobrazeno všech ${VSECHNA_DATA.length} restaurací v Brně`;
    }
  }

  // Vyhledávání a reset tlačítko
  const searchInput = document.getElementById('search-input');
  const clearSearchBtn = document.getElementById('clear-search');

  searchInput.addEventListener('input', (e) => {
    const val = e.target.value;
    clearSearchBtn.style.display = val ? 'block' : 'none';
    renderData(val);
  });

  clearSearchBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearSearchBtn.style.display = 'none';
    renderData('');
    searchInput.focus();
  });

  // Filtrační tlačítka (Pills)
  document.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      AKTIVNI_FILTER = btn.getAttribute('data-filter');
      renderData(searchInput.value);
    });
  });

  async function nacistMenu() {
    const datumText = document.getElementById('datum-text');
    const heroDenNadpis = document.getElementById('hero-den-nadpis');
    const stav = document.getElementById('stav');
    const openCount = document.getElementById('open-count');

    const dnes = new Date();
    const denIndex = dnes.getDay(); // 0 = neděle, 6 = sobota
    JE_VIKEND = (denIndex === 0 || denIndex === 6);
    const denNazev = DNY[denIndex];

    heroDenNadpis.textContent = JE_VIKEND ? `Menu v Brně · ${denNazev} (Víkend)` : `Menu v Brně · ${denNazev}`;
    datumText.textContent = `${denNazev}, ${dnesniDatum()}`;

    try {
      const odpoved = await fetch('menu.json');
      if (!odpoved.ok) throw new Error(`HTTP ${odpoved.status}`);
      const data = await odpoved.json();

      VSECHNA_DATA = data;
      stav.remove();

      // Kontrola stáří dat
      const polozkaSDatem = data.find(d => d.datum);
      DATA_DATUM = polozkaSDatem ? polozkaSDatem.datum : null;
      const dnesniIso = `${dnes.getFullYear()}-${String(dnes.getMonth() + 1).padStart(2, '0')}-${String(dnes.getDate()).padStart(2, '0')}`;
      JSOU_DATA_STARA = !JE_VIKEND && DATA_DATUM && (DATA_DATUM !== dnesniIso);

      const otevreno = data.filter(d => d.dostupne !== false).length;
      if (JE_VIKEND) {
        openCount.textContent = '☕ O víkendu se denní menu nepodává';
      } else if (JSOU_DATA_STARA) {
        openCount.textContent = `⚠️ Nabídka z předchozího dne (${formatujDatumCz(DATA_DATUM)})`;
      } else {
        openCount.textContent = `🟢 ${otevreno} z ${data.length} podniků má dnes menu`;
      }

      renderData('');
    } catch (e) {
      stav.textContent = 'Menu se nepodařilo načíst ze souboru menu.json.';
    }
  }

  nacistMenu();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
<script data-goatcounter="https://drtilow.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

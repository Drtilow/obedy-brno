name: Aktualizace menu

on:
  schedule:
    # Vyhýbáme se celé hodině (:00) a špičce 05:00 UTC, kde GitHub Actions nabíral až 8hodinové zpoždění.
    # Spouštíme pouze v pracovní dny (pondělí–pátek: 1-5).
    # 1. ranní běh: 06:23 UTC (07:23 SEČ v zimě / 08:23 SELČ v létě)
    - cron: '23 6 * * 1-5'
    # 2. záložní běh: 07:41 UTC (08:41 SEČ v zimě / 09:41 SELČ v létě)
    - cron: '41 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Nainstalovat Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ces

      - name: Nainstalovat Python závislosti
        run: pip install -r requirements.txt

      - name: Spustit scraper
        run: python scrape_menu.py

      - name: Commitnout a pushnout menu.json (jen při změně)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add menu.json
          if git diff --cached --quiet; then
            echo "menu.json se nezměnil, commit se přeskakuje."
          else
            git commit -m "Aktualizace menu.json ($(date -u +%Y-%m-%d))"
            if ! git pull --rebase origin main; then
              echo "::error::git pull --rebase selhal, nejspíš kvůli konfliktu s mezitímní změnou na GitHubu. Commit s aktualizací menu.json zůstal jen lokálně v tomto běhu a nebyl napushnutý - je potřeba ruční zásah (podívat se, co se v repozitáři mezitím změnilo, a konflikt vyřešit)."
              exit 1
            fi
            git push
          fi

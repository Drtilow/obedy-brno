name: Aktualizace menu

on:
  schedule:
    # 05:00 UTC = 7:00 letního času (CEST). Spouštíme dřív kvůli občasnému zpoždění 
   # GitHub Actions scheduled běhů (běžně 2-3 hodiny).
  - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Nainstalovat Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ces

      - name: Nainstalovat Python závislosti
        run: pip install -r requirements.txt

      - name: Spustit scraper
        run: python scrape_menu.py

      - name: Commitnout a pushnout menu.json (jen při změně)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add menu.json
          if git diff --cached --quiet; then
            echo "menu.json se nezměnil, commit se přeskakuje."
          else
            git commit -m "Aktualizace menu.json ($(date -u +%Y-%m-%d))"
            if ! git pull --rebase origin main; then
              echo "::error::git pull --rebase selhal, nejspíš kvůli konfliktu s mezitímní změnou na GitHubu. Commit s aktualizací menu.json zůstal jen lokálně v tomto běhu a nebyl napushnutý - je potřeba ruční zásah (podívat se, co se v repozitáři mezitím změnilo, a konflikt vyřešit)."
              exit 1
            fi
            git push
          fi
